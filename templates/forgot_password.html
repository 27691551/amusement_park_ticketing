{% extends "base.html" %}

{% block title %}忘記密碼{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<style>
    .form-container {
        position: relative;
        width: 100%;
        height: 550px;
        display: flex;
    }
    .image-box {
        position: absolute;
        left: 0;
        width: 50%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
        border-radius: 30px 0 0 30px;
    }
    .image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 30% center;
    }
    .form-box.login {
        position: absolute;
        right: 0;
        width: 50%;
        height: 100%;
        z-index: 2;
    }
    .toggle-box { display: none; }
    .wrapper {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 20px;
    }
    .container {
        position: relative;
        width: 100%;
        height: 550px;
        border-radius: 30px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        background-color: #fff;
    }
    .form-box form { padding: 40px; }
    .form-box h1 { margin-bottom: 20px; font-size: 28px; }
    .info-text { margin-bottom: 20px; color: #666; }
    .input-box { position: relative; margin-bottom: 20px; }
    .input-box input {
        width: 100%;
        padding: 12px 40px 12px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }
    .input-box i {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
    }
    .btn {
        width: 100%;
        padding: 12px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }
    .btn:hover { background-color: #45a049; }
    .success { color: green; margin-top: 10px; }
    .error { color: red; margin-top: 10px; }
</style>
{% endblock %}

{% block content %}
<main class="wrapper">
    <div class="container">
        <div class="form-container">
            <!-- 左側圖片 -->
            <div class="image-box">
                <img src="{{ url_for('static', filename='images/qu.png') }}" alt="忘記密碼插圖">
            </div>
            <!-- 右側表單 -->
            <div class="form-box login">
                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <h1>忘記密碼</h1>
                    <p class="info-text">請輸入您的帳號和註冊時的 Email，以重設密碼</p>
                    <div class="input-box">
                        <input type="text" name="username" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                    <div class="input-box">
                        <input type="email" name="email" placeholder="Email" required>
                        <i class='bx bxs-envelope'></i>
                    </div>
                    <div class="input-box">
                        <input type="password" name="new_password" placeholder="新密碼" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <button type="submit" class="btn">重設密碼</button>
                    {% if message %}
                        <p class="success">{{ message }}</p>
                    {% elif error %}
                        <p class="error">{{ error }}</p>
                    {% endif %}
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
