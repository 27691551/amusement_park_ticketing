<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>錯誤</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        h1 {
            color: #dc3545;
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #0056b3;
        }

        .message {
            font-weight: bold;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <h1>錯誤</h1>
    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}
    <p><a href="{{ url_for('index') }}">返回首頁</a></p>
</body>
</html>
