{% extends "base.html" %}

{% block title %}遊樂園-購物{% endblock %}

{% block css %}

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style1.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user_menu.css') }}">

{% endblock %}

{% block style %}

    <style>
        .empty-cart-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #CCEEFF;
        }
        .empty-cart-title {
            color: #485652;
            font-size: 1.6em;
            font-weight: bold;
            margin-bottom: 32px;
            text-align: center;
        }
        .empty-cart-img {
            width: 220px;
            max-width: 80vw;
            display: block;
            margin: 0 auto;
        }
    </style>

{% endblock %}

{% block content %}

    <main style="margin-top:90px;">
        <div class="empty-cart-container">
            <div class="empty-cart-title">購物車目前是空的~快去選購吧！</div>
            <img src="{{ url_for('static', filename='images/emptyshopping.png') }}" alt="購物車空" class="empty-cart-img">
        </div>
    </main>

{% endblock %}

{% block scripts %}

    <script src="{{ url_for('static', filename='js/user_menu.js') }}"></script>

{% endblock %}
