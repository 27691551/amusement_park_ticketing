{% extends "base.html" %}

{% block title %}遊樂園-登入{% endblock %}

{% block css %}

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user_menu.css') }}">

{% endblock %}


{% block content %}

    <main class="wrapper">
    <div class="container">
        <div class="form-box login">
            <form action="{{ url_for('login') }}" method = "POST">
                <h1>登錄</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username/Email" name = "account" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" name = "password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="forgot-link">
                    <a href="{{ url_for('forgot_password') }}">忘記密碼?</a>
                </div>
                <button type="submit" class="btn">登錄</button>
                <p>使用社交平台登錄</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-google'></i></a>
                    <a href="#"><i class='bx bxl-facebook'></i></a>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <form action="{{ url_for('register') }}" method = "POST">
                <h1>註冊</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" name = "username" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="Email" name = "email" required>
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" name = "password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <button type="submit" class="btn">註冊</button>
                <p>使用社交平台註冊</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-google'></i></a>
                    <a href="#"><i class='bx bxl-facebook'></i></a>
                </div>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>哈囉, 歡迎!</h1>
                <p>沒有帳號?</p>
                <button class="btn register-btn">註冊</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>歡迎回來!</h1>
                <p>已經有帳號?</p>
                <button class="btn login-btn">登錄</button>
            </div>
        </div>
    </div>
    </main>

{% endblock %}

{% block scripts %}

    <script src="{{ url_for('static', filename='js/script1.js') }}"></script>
    <script src="{{ url_for('static', filename='js/user_menu.js') }}"></script>

{% endblock %}
